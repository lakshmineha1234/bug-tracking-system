spring.application.name=bugtrack

# Optional local overrides (database credentials, first admin). The file is git-ignored.
spring.config.import=optional:file:./application-local.properties

server.port=${PORT:8080}

# Database: credentials come from environment variables, never from source control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bug_tracking_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Development schema handling. Switch to a migration tool (Flyway/Liquibase) before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Browsers re-check the frontend files on each load (unchanged files return 304), so updates show up immediately.
spring.web.resources.cache.cachecontrol.no-cache=true

# Session cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m

# Email notifications. While disabled, emails are written to the log instead of being sent.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:BugTrack <no-reply@bugtrack.local>}
# Base address used for links in emails
app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Initial admin account, created on startup only if no admin exists yet.
app.admin.email=${BUGTRACK_ADMIN_EMAIL:}
app.admin.password=${BUGTRACK_ADMIN_PASSWORD:}
app.admin.name=${BUGTRACK_ADMIN_NAME:Administrator}
