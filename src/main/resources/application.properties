spring.application.name=bugtrack

# Optional local overrides (database credentials, first admin). The file is git-ignored.
spring.config.import=optional:file:./application-local.properties

server.port=${PORT:8080}

# Database: credentials come from environment variables, never from source control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bug_tracking_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Development schema handling. Switch to a migration tool (Flyway/Liquibase) before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Session cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m

# Initial admin account, created on startup only if no admin exists yet.
app.admin.email=${BUGTRACK_ADMIN_EMAIL:}
app.admin.password=${BUGTRACK_ADMIN_PASSWORD:}
app.admin.name=${BUGTRACK_ADMIN_NAME:Administrator}
