# Production settings, used together with application.properties when SPRING_PROFILES_ACTIVE=prod.
# Everything secret (database password, first admin, mail login) still comes from environment variables.

# The hosting provider ends HTTPS at its proxy and forwards plain HTTP: trust its X-Forwarded-* headers,
# so the app knows requests were HTTPS (secure cookies, HSTS, correct redirects).
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# Attachments go on a persistent disk mounted at /data.
app.attachments.dir=${ATTACHMENTS_DIR:/data/attachments}

# Finish in-flight requests before shutting down during a redeploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
