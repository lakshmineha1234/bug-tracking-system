# Tests use an in-memory H2 database so they run without MySQL.
spring.datasource.url=jdbc:h2:mem:bugtrack_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Tests build the schema with the same Flyway migrations as production, and Hibernate checks it matches the entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.admin.email=
app.admin.password=
